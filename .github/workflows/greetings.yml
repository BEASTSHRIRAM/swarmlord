# Greets first-time issue authors and first-time PR authors. pull_request_target is
# needed so a fork PR can be commented on (a pull_request token is read-only there);
# no checkout, no run: steps, so PR code is never executed. The messages point at the
# three things every SwarmLord bug report needs and at CONTRIBUTING's pre-PR checklist.
name: greetings

on:
  issues:
    types: [opened]
  pull_request_target:   # zizmor: ignore[dangerous-triggers] -- no checkout, no code execution
    types: [opened]

permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d  # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue here.

            The agent CLIs change behaviour between releases, so to reproduce anything we need three things. If they are not in the report yet, please add them:

            - the agent involved and its `--version`, plus your OS (macOS / Linux / WSL — native Windows is not recommended for headless delegation)
            - the exact command you ran (for example `swarmlord-delegate --task-type backend --dir . "..."`) and its stderr — the `SWARMLORD_RUN` line matters
            - what you expected and what happened instead

            `swarmlord-doctor` output helps too. Thanks!
          pr_message: |
            Thanks for your first pull request.

            Before review, please check the items from CONTRIBUTING.md:

            - `bash tests/run-tests.sh` passes (it stubs every agent CLI, no network, no tokens). CI runs it on Ubuntu.
            - If behaviour changed, `README.md`, `skills/swarmlord/SKILL.md` and `CHANGELOG.md` say so, and any claim about an agent CLI states what was verified, against which version, and from which official source.
            - Target bash 3.2 and BSD userland: no `declare -A`, `mapfile`, `${var^^}` or GNU-only flags.

            Automated review starts on its own for PRs from this repository. For PRs from forks a maintainer approves the run first, so a quiet check is not a rejection.
